<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q3 · 实时计算进度</title>
<style>
:root{--ink:#132d43;--muted:#708295;--line:#dce4eb;--blue:#196bc2;--amber:#a55d0b;--green:#19765b}*{box-sizing:border-box}body{margin:0;background:#f2f5f7;color:var(--ink);font:14px/1.55 "Avenir Next","PingFang SC",sans-serif}header{padding:25px 26px 22px;background:#122e45;color:white;border-bottom:4px solid #5da8ee}.eyebrow{letter-spacing:.17em;font-size:10px;color:#9db8cb;text-transform:uppercase}h1{font-size:25px;font-weight:600;margin:8px 0 5px;letter-spacing:-.02em}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:12px;padding:5px 10px;border:1px solid #6b8498;border-radius:3px;white-space:nowrap}main{max-width:1100px;margin:auto;padding:22px 24px}.notice{background:#fff8ec;border-left:3px solid #d99b35;padding:12px 15px;margin-bottom:21px;line-height:1.7;font-size:13px}.quiet{color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}.metric{background:#fff;padding:18px 20px;border:1px solid var(--line)}.label{font-size:12px;color:var(--muted);letter-spacing:.04em}.number{font-size:38px;letter-spacing:-.045em;font-weight:600;line-height:1.3;margin:5px 0}.number small{font-size:15px;letter-spacing:0;color:var(--muted);font-weight:400}.bar{height:4px;background:#e9eef2;margin:12px 0 8px}.bar i{height:100%;display:block;background:var(--blue);transition:width .3s}.warm .bar i{background:#7993a7}.section{background:white;border:1px solid var(--line);margin:16px 0;padding:19px 20px}h2{font-weight:600;font-size:15px;margin:0 0 15px;display:flex;align-items:center;justify-content:space-between}.node{font-size:24px;font-weight:500;letter-spacing:-.025em}.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.value{font-family:"SFMono-Regular",Menlo,monospace;font-size:13px;text-align:right;overflow-wrap:anywhere}.gap{font-size:29px;font-family:"Avenir Next",sans-serif;font-weight:600;color:var(--amber)}.save{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.dot{width:6px;height:6px;background:currentColor;border-radius:50%;flex-shrink:0}.log{margin:0;max-height:220px;overflow:auto;background:#f7f9fb;padding:12px;font:11px/1.8 "SFMono-Regular",Menlo,monospace;white-space:pre-wrap;color:#53697b}.foot{display:flex;justify-content:space-between;gap:15px;font-size:11px;color:var(--muted);padding-top:8px}.error{color:#a74336}button{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:12px}details summary{cursor:pointer;color:var(--muted);font-size:12px}details .row{font-size:12px}.hidden{display:none}@media(max-width:440px){header{padding:20px}main{padding:16px}.metrics{gap:10px}.metric{padding:15px}.number{font-size:31px}.section{padding:16px}.badge{padding:4px 7px}h1{font-size:22px}}
</style>
<header><div class="eyebrow">C题 / 第三问 · Run Monitor</div><div class="headrow"><h1>实时计算进度</h1><span id="badge" class="badge">连接中</span></div><div class="quiet" style="color:#a5bdcf">每 2 秒刷新 · 核对进程存活 · 数据来自真实检查点</div></header>
<main><div id="notice" class="notice">正在获取真实运行状态…</div>
<div class="metrics"><div class="metric"><div class="label">正式结果 · 2—12 月</div><div class="number"><span id="formal">—</span><small> / 334 天</small></div><div class="bar"><i id="formalbar"></i></div><div class="quiet">完整主表生成后才标记完成</div></div><div class="metric warm"><div class="label">因果预热 · 1 月</div><div class="number"><span id="warm">—</span><small> / 31 天</small></div><div class="bar"><i id="warmbar"></i></div><div class="quiet">已完成日期可从检查点恢复</div></div></div>
<section class="section"><h2>当前节点 <span class="quiet" id="pid">—</span></h2><div class="node" id="node">—</div><div class="row"><span>当前最优性间隙</span><span><span class="gap" id="gap">—</span><span class="quiet"> / 3%优先</span></span></div><div class="row"><span>节点接受状态</span><span class="value" id="acceptance">求解中</span></div><div class="row"><span>节点累计用时</span><span class="value" id="duration">—</span></div><div class="row"><span>已保存切片</span><span class="value" id="slices">—</span></div><div class="row"><span>最近已提交日末 SOC</span><span class="value" id="soc">—</span></div><div class="row"><span class="save"><i class="dot"></i><span id="save">—</span></span><span class="quiet" id="budget">节点硬时限</span></div><div class="row"><span>当前求解并行</span><span class="value" id="parallel">—</span></div><details><summary>求解详情</summary><div class="row"><span>求解方式</span><span class="value" id="solver">—</span></div><div class="row"><span>可行目标 UB</span><span class="value" id="objective">—</span></div><div class="row"><span>有效下界 LB</span><span class="value" id="bound">—</span></div></details></section>
<section class="section" id="validationSection"><h2>检验队列 <span id="validation" class="quiet">—</span></h2><div class="quiet">辅助检验状态。</div></section>
<section class="section"><h2>最新计算记录 <button onclick="refresh()">立即刷新</button></h2><pre class="log" id="logs">等待日志</pre></section>
<div class="foot"><span id="run">—</span><span id="updated">—</span></div></main>
<script>
const $=id=>document.getElementById(id);const number=(x,n=2)=>x==null?'—':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:n});const duration=x=>x==null?'—':x<60?`${Math.floor(x)} 秒`:`${Math.floor(x/60)} 分 ${Math.floor(x%60)} 秒`;
async function refresh(){try{const response=await fetch('/api/status?t='+Date.now(),{cache:'no-store'});const s=await response.json();if(!response.ok)throw Error(s.error||'无法读取状态');
 const labels={running:'● 计算中',switching:'● 切换求解器中',stopped:'● 主进程未运行',complete:'● 主结果已完成',starting:'● 正在恢复'};$('badge').textContent=labels[s.status]||s.status;
 $('formal').textContent=s.formal_days;$('warm').textContent=s.warm_days;$('formalbar').style.width=(s.formal_days/334*100)+'%';$('warmbar').style.width=(s.warm_days/31*100)+'%';
 $('node').textContent=s.status==='complete'?'全年主结果已生成':s.active_date?`${s.active_date} · ${s.active_hour||'—'}:00`:'准备输入';$('pid').textContent=s.status==='complete'?'计算已正常结束':s.worker_alive?`进程 ${s.worker_pid} 存活`:'未检测到主计算进程';
 $('gap').textContent=s.gap==null?'—':(s.gap*100).toFixed(3)+'%';$('gap').style.color=s.node_reliable?'var(--green)':'var(--amber)';$('duration').textContent=duration(s.node_seconds);$('slices').textContent=number(s.slices,0);$('soc').textContent=number(s.soc,3)+' kWh';
 $('acceptance').textContent=s.status==='complete'?'全年结果已验收':s.node_reliable?'3%证书已通过':s.accepted_by==='hard_limit_feasible'?'限时可行解已验证':'求解中';$('budget').textContent=s.status==='complete'?'主结果已完成':s.production_rescue?'06点35秒 · 其余8秒':'120秒切片';
 $('save').textContent=s.status==='complete'?'全年检查点已完整保存':s.saved_ago_seconds==null?'尚未产生节点检查点':`${duration(s.saved_ago_seconds)}前保存检查点`;
 $('parallel').textContent=s.status==='complete'?'计算已结束':`${s.solver_threads||'—'} 线程 · CPU ${number(s.cpu_percent,0)}%`; $('solver').textContent=s.solver+(s.solver_version?' · '+s.solver_version:'');$('objective').textContent=number(s.objective,5);$('bound').textContent=number(s.lower_bound,5);$('logs').textContent=s.log_lines.join('\n')||'尚无日志';
 $('validation').textContent=({waiting_scope:'等待范围选择',waiting_main:'等待主表',base_FIV:'FIV 对照',complete:'已完成'})[s.validation_phase]||s.validation_phase;
 $('validationSection').classList.toggle('hidden',s.production_rescue);
 $('run').textContent=s.run_name;$('updated').textContent='核验于 '+new Date(s.observed_at*1000).toLocaleTimeString('zh-CN');
 if(s.status==='switching'||s.status==='starting')$('notice').textContent='正在从已保存的25天结果切换到比赛生产救援；旧目录和检查点完整保留。';
 else if(s.status==='stopped')$('notice').textContent='主计算进程当前未运行。页面保留最后检查点，但这些数值不代表进程仍在推进。';
 else if(s.status==='complete')$('notice').textContent='全年主结果已生成。下面保留最后计算记录与真实精度状态。';
 else if(s.production_rescue)$('notice').textContent='比赛生产救援运行中：3%证书优先；06:00最多35秒，其余节点最多8秒。到限后仅接受通过原物理与完整矩阵验证的可行策略，并保存实际UB、LB和gap。';
 else $('notice').textContent='主计算运行中，预热与正式结果分别统计。';
 $('notice').classList.remove('error');
 }catch(e){$('badge').textContent='● 状态连接中断';$('notice').textContent='未取得最新状态：'+e.message+'。保留的是上次观测，不能据此认定程序仍在运行。';$('notice').classList.add('error');}}
refresh();setInterval(refresh,2000);
</script></html>
