<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>问题二与问题三敏感性实验进度</title>
<style>body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;background:#f5f7fa;color:#263546}main{max-width:1100px;margin:32px auto;padding:0 22px}h1{font-size:25px;margin-bottom:5px}h2{font-size:18px;margin:0 0 12px}.sub{color:#617386}.box{background:white;border:1px solid #dce2e8;border-radius:9px;padding:20px;margin:18px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bar{height:12px;background:#e8edf1;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#317981;width:0}.big{font-size:30px;font-weight:600}.note{background:#fff6df;border-left:4px solid #c59128;padding:10px 14px}.small{font-size:13px;color:#617386}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e6eaf0;padding:8px 6px}th{font-weight:600;color:#617386}.ok{color:#227c52}.limited{color:#a87017}.failed{color:#b83939}#error{color:#b83939}@media(max-width:680px){.row{grid-template-columns:1fr}.box{padding:14px}table{font-size:12px}}</style>
<main><h1>问题二与问题三敏感性实验</h1><div class="sub">4个代表日 × 单因素扰动；复用正式基准，不重跑全年</div><div class="box"><div id="phase">读取真实进度…</div><span class="big" id="count">0 / 32</span><div class="bar"><div id="bar"></div></div><div class="small" id="updated"></div></div><div id="notes"></div><div class="box"><b>实验结果</b>　<a href="report.md" download>报告</a>　<a href="aggregate_results.csv" download>聚合表</a>　<a href="daily_results.csv" download>逐日结果</a>　<a href="solver_quality.csv" download>求解质量</a></div><div class="row"><section class="box"><h2>问题二</h2><div id="q2">准备基准输入</div></section><section class="box"><h2>问题三</h2><div id="q3">准备基准输入</div></section></div><section class="box"><h2>自动选择的代表日</h2><table><thead><tr><th>问题</th><th>工况</th><th>日期</th><th>日初SOC / kWh</th></tr></thead><tbody id="reps"></tbody></table></section><section class="box"><h2>逐项计算结果</h2><table><thead><tr><th>问题 / 参数</th><th>日期</th><th>状态</th><th>费用变化</th><th>紧急量 / kWh</th><th>耗时 / 秒</th></tr></thead><tbody id="jobs"></tbody></table></section><div id="error"></div></main>
<script>
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function worker(w){if(!w)return '准备基准输入';let age=w.started_at?Math.max(0,Date.now()/1000-w.started_at):0;if(w.phase.includes('完成'))return `<b>${esc(w.phase)}</b><br><span class="small">${esc(w.detail)}</span>`;return `<b>${esc(w.phase)}</b><br>${esc(w.date)} ${esc(w.parameter)} ${esc(w.value)}<br>节点：${esc(w.hour)}　已用时：${age.toFixed(0)} 秒<br><span class="small">${esc(w.detail)}</span>`}
async function update(){try{let s=await(await fetch('/api/status',{cache:'no-store'})).json();let jobs=s.jobs||[],done=jobs.filter(x=>['complete','limited','failed'].includes(x.status)).length;document.getElementById('phase').textContent=s.phase;document.getElementById('count').textContent=`${done} / ${s.total_jobs} 次扰动计算`;document.getElementById('bar').style.width=(100*done/s.total_jobs)+'%';document.getElementById('updated').textContent='实际完成 '+jobs.filter(x=>x.status==='complete').length+'，限时可行 '+jobs.filter(x=>x.status==='limited').length+'，失败 '+jobs.filter(x=>x.status==='failed').length+'；刷新 '+new Date().toLocaleTimeString();document.getElementById('notes').innerHTML=(s.notes||[]).map(t=>`<p class="note">${esc(t)}</p>`).join('');for(let q of ['q2','q3'])document.getElementById(q).innerHTML=worker(s.workers[q]);document.getElementById('reps').innerHTML=['q2','q3'].flatMap(q=>(s.representatives?.[q]||[]).map(r=>`<tr><td>${q.toUpperCase()}</td><td>${esc(r.role)}</td><td>${esc(r.date)}</td><td>${Number(r.initial_soc).toFixed(3)}</td></tr>`)).join('');document.getElementById('jobs').innerHTML=jobs.map(j=>`<tr><td>${esc(j.question)} ${esc(j.parameter)}=${esc(j.value)}</td><td>${esc(j.date)}</td><td class="${j.status==='complete'?'ok':j.status==='failed'?'failed':'limited'}">${esc(j.status_label||({pending:'等待',running:'计算中',complete:'完成',limited:'限时可行',failed:'失败'}[j.status]||j.status))}</td><td>${j.delta_cost_pct==null?'—':j.delta_cost_pct.toFixed(3)+'%'}</td><td>${j.emergency_kwh==null?'—':j.emergency_kwh.toFixed(3)}</td><td>${j.seconds==null?'—':j.seconds.toFixed(1)}</td></tr>`).join('');document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent='进度读取失败：'+e.message}}update();setInterval(update,2000);
</script></html>
