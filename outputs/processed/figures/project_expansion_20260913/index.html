<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全项目补充科研图 · 进度</title><style>body{margin:0;background:linear-gradient(130deg,#fffef0,#eef3ff 60%,#f1eefa);color:#002254;font:16px/1.65 -apple-system,"Songti SC",serif}main{max-width:1150px;margin:auto;padding:28px 22px}h1{font-size:28px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}article{background:#fff;padding:20px;border:0}h2{font-size:18px}p{color:#64748b}img{width:100%;height:280px;object-fit:contain}a{color:#4b69ef}.pill{font-size:12px;color:#4b69ef}progress{width:100%;accent-color:#4b69ef;height:12px}</style><main><h1>全项目补充科研图</h1><p id="stage">正在加载进度…</p><progress id="bar" value="0" max="12"></progress><p>LaTeX风格字体 · 纯色曲线 · 无边框浅色/渐变区域 · 已有数据直接成图</p><div id="cards"></div></main><script>let last='';async function update(){try{const s=await(await fetch('status.json',{cache:'no-store'})).json();const str=JSON.stringify(s);if(last===str)return;last=str;document.getElementById('stage').textContent=s.stage;document.getElementById('bar').value=s.items.filter(i=>i.png).length;document.getElementById('cards').innerHTML=s.items.map(i=>`<article><span class="pill">${i.id} · ${i.status}</span><h2>${i.title}</h2>${i.png?`<a href="${i.png}"><img src="${i.png}" alt="${i.title}"></a><p><a href="${i.svg}">SVG矢量图</a></p>`:'<p>正在准备真实数据与布局</p>'}</article>`).join('')}catch(e){document.getElementById('stage').textContent='进度数据暂未读取，请稍后刷新'}}update();setInterval(update,2500)</script></html>
